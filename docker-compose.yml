services:
  meshgram:
    build: .
    container_name: meshgram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MESHGRAM_CONFIG_PATH: /app/config.yaml
      MESHGRAM_DATA_DIR: /app/data
      PACKET_MAP_HOST: 0.0.0.0
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Persistent state (packet_map history), kept across rebuilds and redeploys.
      - meshgram-data:/app/data
    # Uncomment to reach the packet_map web app (also set PACKET_MAP_HOST=0.0.0.0):
    ports:
      - "8080:8080"

volumes:
  meshgram-data:
