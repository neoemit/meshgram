services:
  meshgram:
    build: .
    container_name: meshgram
    restart: unless-stopped
    volumes:
      # Every setting, secrets included (copy config.example.yaml to config.yaml).
      - ./config.yaml:/app/config.yaml:ro
      # Persistent state (packet_map history), kept across rebuilds and redeploys.
      - meshgram-data:/app/data
    # The packet_map web app; set its host to 0.0.0.0 in config.yaml.
    ports:
      - "8080:8080"

volumes:
  meshgram-data:
