services:
  meshgram:
    build: .
    container_name: meshgram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MESHGRAM_CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    # Uncomment to reach the packet_map web app (also set PACKET_MAP_HOST=0.0.0.0):
    # ports:
    #   - "8080:8080"
