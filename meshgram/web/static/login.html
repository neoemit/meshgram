<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Log in · Meshgram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234cc2ff'/%3E%3Cpath d='M10 21 16 10 22 21Z' fill='none' stroke='%2304121c' stroke-width='2' stroke-linejoin='round'/%3E%3Cg fill='%2304121c'%3E%3Ccircle cx='16' cy='10' r='3'/%3E%3Ccircle cx='10' cy='21' r='3'/%3E%3Ccircle cx='22' cy='21' r='3'/%3E%3C/g%3E%3C/svg%3E">
<script>
  // The page's saved (or the system) theme.
  (function () {
    var theme = null;
    try { theme = JSON.parse(localStorage.getItem("meshgram.theme")); } catch (e) {}
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #0a0e13; --surface: #10151c; --border: #242e3a; --border-strong: #354253;
    --text: #e9eef4; --text-3: #8b98a7; --accent: #4cc2ff; --accent-contrast: #04121c; --bad: #ff7b72;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eef2f6; --surface: #ffffff; --border: #dde3ea; --border-strong: #c3cdd8;
    --text: #0f172a; --text-3: #546072; --accent: #0b7fc7; --accent-contrast: #ffffff; --bad: #cf222e;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
  form { width: 100%; max-width: 340px; display: grid; gap: 14px; padding: 28px 24px;
         background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
  .logo .bg { fill: var(--accent); }
  .logo .fg { fill: var(--accent-contrast); stroke: var(--accent-contrast); }
  label { display: grid; gap: 6px; font-weight: 550; }
  input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border-strong);
          border-radius: 8px; padding: 9px 11px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px;
           background: var(--accent); color: var(--accent-contrast); cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .hint { margin: 0; color: var(--text-3); font-size: 13px; }
  .error { margin: 0; color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<form id="login" novalidate>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect class="bg" width="32" height="32" rx="9"/>
      <path class="fg" d="M10 21 16 10 22 21Z" fill="none" stroke-width="2" stroke-linejoin="round" style="fill:none"/>
      <circle class="fg" cx="16" cy="10" r="3"/><circle class="fg" cx="10" cy="21" r="3"/><circle class="fg" cx="22" cy="21" r="3"/>
    </svg>
    <h1 id="title">Meshgram</h1>
  </div>
  <label>Password
    <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <p class="error" id="error" role="alert" hidden></p>
  <button type="submit" id="submit">Log in</button>
  <p class="hint">You stay logged in on this browser for 30 days.</p>
</form>
<script>
"use strict";
const CONFIG = /*__MESHGRAM_CONFIG__*/{};
if (CONFIG.title) {
  document.getElementById("title").textContent = CONFIG.title;
  document.title = `Log in · ${CONFIG.title}`;
}
document.getElementById("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  const button = document.getElementById("submit");
  const input = document.getElementById("password");
  error.hidden = true;
  button.disabled = true;
  try {
    const response = await fetch("api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password: input.value }),
    });
    if (response.ok) {
      location.reload();
      return;
    }
    let data = null;
    try { data = await response.json(); } catch { /* not JSON */ }
    error.textContent = (data && data.error) || `${response.status} ${response.statusText}`;
  } catch {
    error.textContent = "Can't reach Meshgram; check that it's running";
  }
  error.hidden = false;
  button.disabled = false;
  input.select();
});
</script>
</body>
</html>
