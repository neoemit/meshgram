# Meshgram configuration.
#
# Copy this file to config.yaml and fill it in:
#   cp config.example.yaml config.yaml && chmod 600 config.yaml
#
# config.yaml holds every setting, secrets included, so it's gitignored and
# should be readable only by you (or the service user). Meshgram reads no other
# settings: environment variables and .env files are not consulted. Upgrading
# from a version that used .env? Run `python -m meshgram.migrate_config`.
#
# Two environment variables say where files are (they aren't settings):
#   MESHGRAM_CONFIG_PATH  this file (default: config.yaml)
#   MESHGRAM_DATA_DIR     persistent state such as packet_map history
#                         (default: data; /app/data in Docker)

telegram:
  # From @BotFather. Required.
  bot_token: "123456789:ABCDEF_your_bot_token_here"
  # The group the bot bridges to (forward a message to @userinfobot). Required.
  group_id: -1001234567890
  include_captions: true
  sender_prefix_template: "[{display_name}] {message}"

runtime:
  log_level: INFO   # DEBUG | INFO | WARNING | ERROR

# Selects which radio backend the bridge speaks to.
mesh:
  backend: meshtastic   # or "meshcore"

# Only used when mesh.backend = meshtastic.
meshtastic:
  bridge_channel: 0
  node_name_overrides: {}
  # Example:
  # node_name_overrides:
  #   "!1234abcd": "RTR-A"
  connection:
    mode: serial               # serial | tcp
    serial_device: /dev/ttyUSB0
    tcp_host: localhost
    tcp_port: 4403
    # Skip the full node DB download at startup; helps on proxied links.
    # Docker Desktop on macOS (serial bridged over TCP by socat on the host):
    #   mode: tcp, tcp_host: host.docker.internal, no_nodes: true
    no_nodes: false

# Only used when mesh.backend = meshcore.
# MeshCore has no native packet-level reactions and no reply threading;
# the bridge silently drops reaction syncs and reply-id metadata in that mode.
meshcore:
  bridge_channel: 0
  # Map pubkey prefix → display name (similar to meshtastic.node_name_overrides):
  contact_name_overrides: {}
  # Optional fallback for identity-less channel echoes. Keep disabled unless
  # your MeshCore feed omits sender identity and you observe self-echo loops.
  outbound_echo_text_fallback_enabled: false
  outbound_echo_text_fallback_ttl_seconds: 2.0
  connection:
    mode: serial               # serial | tcp | ble
    serial_device: /dev/ttyACM0
    baudrate: 115200
    tcp_host: localhost
    tcp_port: 5000
    # ble_address: "12:34:56:78:90:AB"
    # ble_pin: "123456"
    auto_reconnect: true

chunking:
  enabled: true
  prefix_template: "({index}/{total}) "
  inter_chunk_delay_ms: 150
  max_chunk_bytes: 160
  broadcast_max_chunk_bytes: 120
  broadcast_min_inter_chunk_delay_ms: 2500
  payload_safety_margin_bytes: 12
  retry_max_attempts: 3
  retry_initial_delay_ms: 500
  retry_backoff_factor: 2.0
  wait_for_ack: true
  ack_timeout_ms: 20000
  abort_on_chunk_failure: true

plugins:
  - name: bridge
    enabled: true
    settings:
      channel: 0
      reply_link_ttl_hours: 24
      reactions_enabled: true
      meshtastic_want_ack: true
      missing_target_policy: fallback_message
      reply_missing_suffix: "(reply target not found)"
      reaction_missing_notice_template: "(reaction target not found)"

  - name: ping_pong
    enabled: true
    settings:
      keyword_responses:
        Ping: "Pong"
        Ack: "Ack"
      # packet_id_only (default): respond to each distinct message ID.
      # sender_keyword_window: also suppress repeated keyword pings per sender.
      response_dedupe_mode: packet_id_only
      channels: [0]

  - name: trace_me  # "trace-me" also works
    enabled: false
    settings:
      # MeshCore only. Reply when a MeshCore channel message is exactly "trace".
      keywords: ["trace"]
      # Omit or set to "same" to reply on the incoming MeshCore channel.
      response_channel: same
      # Optional allowlist of incoming MeshCore channels that can trigger trace responses.
      # channels: [0]

  - name: meshmapper
    enabled: false
    settings:
      # MeshCore only. Uploads every packet the radio hears to MeshMapper's
      # MQTT broker (mqtt.meshmapper.net:443, WebSockets + TLS) as an observer.
      # Required: your MeshMapper region code.
      iata: "XXX"
      # Optional overrides (defaults shown):
      # server: mqtt.meshmapper.net
      # port: 443
      # transport: websockets
      # token_audience: mqtt.meshmapper.net
      # status_interval_seconds: 300
      # Also receive other observers' packets for packet_map. They come from
      # MeshMapper's public live feed (no account; metadata only, no packet
      # bytes). With a subscriber account from the broker operator they also
      # come over MQTT with their bytes; the live feed stands by while MQTT is
      # subscribed. Device-signed observer logins can only publish.
      subscribe: true
      live_feed: true
      # subscribe_username: ""
      # subscribe_password: ""
      # subscribe_server: mqtt.meshmapper.net
      # subscribe_port: 443
      # Auth tokens are signed by the radio itself. Only if your firmware can't
      # sign on-device, set the radio's private key (128 hex characters):
      # private_key: ""

  - name: packet_map
    enabled: false
    settings:
      # MeshCore only. Web app with a live map of nodes/repeaters and every
      # packet the radio hears. Open http://<host>:<port>/ in a browser.
      # Use 0.0.0.0 to reach it from other machines; in Docker it must be
      # 0.0.0.0 (docker-compose.yml publishes port 8080).
      host: 127.0.0.1
      port: 8080
      # max_packets: 500
      # max_remote_packets: 1000 # packets from other MeshMapper observers
      max_messages: 1000
      # Nodes and packet history are saved to an SQLite database and restored
      # on restart (inside MESHGRAM_DATA_DIR, default ./data; /app/data in Docker).
      persist: true
      db_path: packet_map.sqlite3
      # Optional HTTP Basic auth (any username):
      # password: ""

  - name: dm_http_command
    enabled: false
    settings:
      timeout_seconds: 8
      error_message: "Unable to fetch {command}"
      commands:
        BATTERY:
          url: "http://192.168.0.10/battery/"
          type: "json"
          value: "data.inv1.soc"
          msg: "{value}%"
          auth:
            type: bearer
            token: "replace_me"
          headers:
            X-Api-Key: "replace_me"
