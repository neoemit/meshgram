# Meshgram configuration.
#
# Copy this file to config.yaml and fill it in:
#   cp config.example.yaml config.yaml && chmod 600 config.yaml
#
# config.yaml holds every setting, secrets included, so it's gitignored and
# should be readable only by you (or the service user). Meshgram reads no other
# settings: environment variables and .env files are not consulted. Upgrading
# from a version that used .env? Run `python -m meshgram.migrate_config`.
#
# Two environment variables say where files are (they aren't settings):
#   MESHGRAM_CONFIG_PATH  this file (default: config.yaml)
#   MESHGRAM_DATA_DIR     persistent state: packet_map history and plugin
#                         settings changed in the web app's control panel
#                         (default: data; /app/data in Docker)

telegram:
  # From @BotFather. Required.
  bot_token: "123456789:ABCDEF_your_bot_token_here"
  # The group the bot bridges to (forward a message to @userinfobot). Required.
  group_id: -1001234567890
  include_captions: true
  sender_prefix_template: "[{display_name}] {message}"

runtime:
  log_level: INFO   # DEBUG | INFO | WARNING | ERROR

# The MeshCore companion radio. MeshCore has no packet-level reactions and no
# reply threading, so the bridge relays messages only.
meshcore:
  # The channel slot bridged to the Telegram group.
  bridge_channel: 0
  # Map pubkey prefix → display name:
  contact_name_overrides: {}
  # Optional fallback for identity-less channel echoes. Keep disabled unless
  # your MeshCore feed omits sender identity and you observe self-echo loops.
  outbound_echo_text_fallback_enabled: false
  outbound_echo_text_fallback_ttl_seconds: 2.0
  connection:
    mode: serial               # serial | tcp | ble
    serial_device: /dev/ttyACM0
    baudrate: 115200
    tcp_host: localhost
    tcp_port: 5000
    # ble_address: "12:34:56:78:90:AB"
    # ble_pin: "123456"
    auto_reconnect: true

# The web app: live packet map, messages, and a control panel for the radio
# (settings, channels, contacts) and the plugins. Open http://<host>:<port>/.
web:
  enabled: true
  # 127.0.0.1 keeps it on this machine. Use 0.0.0.0 to reach it from other
  # machines; in Docker it must be 0.0.0.0 (docker-compose.yml publishes 8080).
  host: 127.0.0.1
  port: 8080
  # HTTP Basic auth (any username). Required for the control panel to change
  # anything unless host is 127.0.0.1: without it the panel is read-only.
  # password: ""
  # title: Meshgram
  # Map tiles; empty uses OpenStreetMap, restyled for the light/dark theme.
  # tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  # tile_attribution: ""

chunking:
  enabled: true
  prefix_template: "({index}/{total}) "
  inter_chunk_delay_ms: 150
  max_chunk_bytes: 160
  broadcast_max_chunk_bytes: 120
  broadcast_min_inter_chunk_delay_ms: 2500
  payload_safety_margin_bytes: 12
  retry_max_attempts: 3
  retry_initial_delay_ms: 500
  retry_backoff_factor: 2.0
  abort_on_chunk_failure: true

# Plugins can also be turned on and off and reconfigured in the web app's
# control panel. Those changes are saved in MESHGRAM_DATA_DIR/plugins.json and
# win over what's here until you reset them there. To keep them as defaults,
# its Config file tab gives you this file with them written in.
plugins:
  - name: bridge
    enabled: true
    settings:
      # Overrides meshcore.bridge_channel when set.
      channel: 0

  - name: ping_pong
    enabled: true
    settings:
      keyword_responses:
        Ping: "Pong"
        Ack: "Ack"
      # packet_id_only (default): respond to each distinct message ID.
      # sender_keyword_window: also suppress repeated keyword pings per sender.
      response_dedupe_mode: packet_id_only
      channels: [0]

  - name: trace_me  # "trace-me" also works
    enabled: false
    settings:
      # Reply when a channel message is exactly "trace".
      keywords: ["trace"]
      # Omit or set to "same" to reply on the incoming channel.
      response_channel: same
      # Optional allowlist of incoming channels that can trigger trace responses.
      # channels: [0]

  - name: meshmapper
    enabled: false
    settings:
      # Uploads every packet the radio hears to MeshMapper's
      # MQTT broker (mqtt.meshmapper.net:443, WebSockets + TLS) as an observer.
      # Required: your MeshMapper region code.
      iata: "XXX"
      # Optional overrides (defaults shown):
      # server: mqtt.meshmapper.net
      # port: 443
      # transport: websockets
      # token_audience: mqtt.meshmapper.net
      # status_interval_seconds: 300
      # Also receive other observers' packets for packet_map. They come from
      # MeshMapper's public live feed (no account; metadata only, no packet
      # bytes). With a subscriber account from the broker operator they also
      # come over MQTT with their bytes; the live feed stands by while MQTT is
      # subscribed. Device-signed observer logins can only publish.
      subscribe: true
      live_feed: true
      # subscribe_username: ""
      # subscribe_password: ""
      # subscribe_server: mqtt.meshmapper.net
      # subscribe_port: 443
      # Auth tokens are signed by the radio itself. Only if your firmware can't
      # sign on-device, set the radio's private key (128 hex characters):
      # private_key: ""

  - name: packet_map
    enabled: false
    settings:
      # Feeds the web app's Map and Messages views: nodes and repeaters with a
      # position, every packet the radio hears, decrypted channel messages.
      # (Its address and password are in the web section.)
      # Packet types left out of the packet list, its filters and the map's
      # live flow (display only: they're still recorded). Easier to pick in the
      # control panel. Names: ADVERT GRP_TXT GRP_DATA TXT_MSG ACK REQ RESPONSE
      # PATH ANON_REQ TRACE MULTIPART CONTROL RAW_CUSTOM TYPE_12 TYPE_13 TYPE_14
      # hidden_packet_types: [ACK, PATH]
      # max_packets: 500
      # max_remote_packets: 1000 # packets from other MeshMapper observers
      max_messages: 1000
      # Nodes and packet history are saved to an SQLite database and restored
      # on restart (inside MESHGRAM_DATA_DIR, default ./data; /app/data in Docker).
      persist: true
      db_path: packet_map.sqlite3

  - name: dm_http_command
    enabled: false
    settings:
      timeout_seconds: 8
      error_message: "Unable to fetch {command}"
      commands:
        BATTERY:
          url: "http://192.168.0.10/battery/"
          type: "json"
          value: "data.inv1.soc"
          msg: "{value}%"
          auth:
            type: bearer
            token: "replace_me"
          headers:
            X-Api-Key: "replace_me"
